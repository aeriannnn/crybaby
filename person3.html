<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atake / | Hall of Shame</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #d8d8d8; font: 16px/1.65 Arial, Helvetica, sans-serif; }
    .page { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 70px; }
    .rainbow-text {
      color: #00f5b0;
      background-image: linear-gradient(90deg, #ff5c8a 0%, #ffb45e 16%, #f6f56a 33%, #5dffbc 50%, #62b5ff 67%, #b785ff 83%, #ff5c8a 100%);
      background-size: 250% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbow-shift 9s linear infinite;
    }
    @keyframes rainbow-shift {
      0% { background-position: 0% 50%; filter: hue-rotate(0deg); }
      100% { background-position: 250% 50%; filter: hue-rotate(360deg); }
    }
    a { color: #d8d8d8; }
    a:hover { color: #fff; }
    h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.2; margin: 28px 0; }
    .info { background: #0d0d0d; border: 1px solid #272727; padding: 24px; overflow-wrap: anywhere; }
    .profile-photo { display: block; max-width: 100%; max-height: 300px; object-fit: contain; margin: 0 auto 24px; }
    .info h2 { margin-top: 0; }
    footer { text-align: center; font-size: 14px; border-top: 1px solid #272727; padding-top: 20px; margin-top: 32px; }
    @media (prefers-reduced-motion: reduce) { .rainbow-text { animation: none; } }
  </style>
</head>
<body>
  <main class="page">
    <a href="index.html">← Back to Hall of Shame</a>
    <h1 class="rainbow-text">Atake /</h1>
    <div class="info">
      <img class="profile-photo" src="person3.png" alt="Atake /" onerror="this.style.display='none'">
      <h2>More information</h2>
      <p>Add the additional information for Atake / here.</p>
      <!-- Replace the paragraph above with your own text and links. -->
    </div>
    <footer>
      <p class="rainbow-text">CREDITS: DEMETER, JAH, ARCHO</p>
      <p><a class="rainbow-text" href="https://t.me/m3ktopia" target="_blank" rel="noopener noreferrer">Contact @m3ktopia on Telegram</a></p>
    </footer>
  </main>
</body>
</html>
